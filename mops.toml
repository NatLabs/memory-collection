[package]
name = "memory-collection"
version = "0.3.1"
description = "A collection of data structures that store their data in stable memory"
repository = "https://github.com/NatLabs/memory-collection"
keywords = ["stable-memory", "encoding", "persistent"]
license = "MIT"

[dependencies]
"base@0.14.11" = "0.14.11"
"itertools@0.2.2" = "0.2.2"
"memory-region@1.3.2" = "1.3.2"
"buffer-deque@0.1.0" = "0.1.0"
"byte-utils@0.1.1" = "0.1.1"

[dev-dependencies]
"test@2.1.1" = "2.1.1"
bench = "1.0.0"
"augmented-btrees@0.7.1" = "0.7.1"
"fuzz@1.0.0" = "1.0.0"
"stableheapbtreemap@1.5.0" = "1.5.0"
"map@9.0.1" = "9.0.1"

[toolchain]
wasmtime = "33.0.1"
moc = "0.14.13"
